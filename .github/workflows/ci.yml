name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
      react: ${{ steps.classify.outputs.react }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$BASE...$HEAD")
            code=$(printf '%s\n' "$files" | sh .github/scripts/needs-full-ci.sh)
            react=$(printf '%s\n' "$files" | sh .github/scripts/touches-react.sh)
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            code=true
            react=$(git diff --name-only "$BEFORE" "$AFTER" | sh .github/scripts/touches-react.sh)
          else
            code=true
            react=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "react=$react" >> "$GITHUB_OUTPUT"

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: sh tools/quality/install-gitleaks.sh
      - env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          else
            range="$BEFORE..$AFTER"
          fi
          tools/quality/bin/gitleaks git --redact --no-banner --log-opts="$range" .

  front:
    name: front
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:e2e:install -- --with-deps
      - id: e2e
        run: npm run test:e2e
      - if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  react-doctor:
    name: react-doctor
    needs: changes
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/quality/package-lock.json
      - run: npm ci --prefix tools/quality --no-audit --no-fund
      - env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            set -- --scope changed --base "$BASE"
          else
            set -- --scope full
          fi
          tools/quality/node_modules/.bin/react-doctor frontend "$@" --verbose --no-telemetry --no-supply-chain --yes

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh backend/api/scripts/init-env.sh
      - run: npm run api:format:check
      - run: npm run api:analyse
      - run: npm run api:test

  executor:
    name: executor
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm run test:executor
