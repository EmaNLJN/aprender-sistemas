name: taller-rust-go
services:
  taller:
    build: .
    network_mode: bridge
    ports:
      - "127.0.0.1:${TALLER_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
