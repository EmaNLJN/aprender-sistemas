name: taller-rust-go

# Entorno de Laravel para php, migrate y test. Los secretos salen del .env de la raíz (fuera
# de Git y del contexto de Docker; lo completa sh api/scripts/init-env.sh). Si falta uno,
# Compose no arranca.
x-mysql-password: &mysql-password '${MYSQL_PASSWORD:?falta MYSQL_PASSWORD en .env (sh api/scripts/init-env.sh)}'

x-laravel-env: &laravel-env
  APP_NAME: Taller
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_KEY: '${APP_KEY:?falta APP_KEY en .env (sh api/scripts/init-env.sh)}'
  APP_URL: 'http://localhost:${TALLER_PORT:-8080}'
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: '3306'
  DB_DATABASE: taller
  DB_USERNAME: taller
  DB_PASSWORD: *mysql-password

# Entorno de `test`: el de producción (DB_HOST=mysql, APP_ENV=production, a propósito: phpunit.xml
# impone la base de pruebas y tests/Feature/DatabaseTest.php lo verifica), pero sin los secretos
# reales, que las pruebas no necesitan.
x-laravel-test-env: &laravel-test-env
  <<: *laravel-env
  APP_KEY: 'base64:dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtISE='
  DB_PASSWORD: no-es-un-secreto

# php y migrate: la misma imagen, sin root, con disco de sólo lectura y sin capacidades. Lo
# que necesite escribir va a un tmpfs declarado acá.
x-laravel-runtime: &laravel-runtime
  build:
    context: ./api
    target: runtime
    additional_contexts:
      repo: .
    args:
      CONTENT_SOURCE_COMMIT: '${CONTENT_SOURCE_COMMIT:-}'
  environment: *laravel-env
  networks: [app]
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 256m
  pids_limit: 64

# Un solo digest para mysql y mysql-test.
x-mysql-image: &mysql-image mysql:9.7@sha256:e2bde46db6563855d7177adb5f0b57b9dc663f5a20927a90f4259d3312068497

# Para mysql y mysql-test. La base que crea MYSQL_DATABASE también nace en español: un CREATE
# TABLE crudo (sin Laravel) hereda la colación del esquema.
x-mysql-command: &mysql-command
  - --character-set-server=utf8mb4
  - --collation-server=utf8mb4_es_0900_ai_ci

# Por TCP y no por socket: mientras se inicializa, el servidor temporal de MySQL sólo escucha
# el socket y respondería al ping antes de estar listo (ADR 0004).
x-mysql-healthcheck: &mysql-healthcheck
  test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 60s
  start_interval: 2s

services:
  taller:
    build: .
    networks: [edge, web]
    ports:
      - '127.0.0.1:${TALLER_PORT:-8080}:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64

  php:
    <<: *laravel-runtime
    networks: [web, app]
    # Reemplaza la lista del ancla: además de /tmp, las vistas compiladas (la página HTML de
    # /api/up) necesitan dónde escribirse.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      # uid/gid 82: www-data de la imagen Alpine; sin esto el tmpfs queda root:root y php no compila vistas.
      - /var/www/html/storage/framework/views:rw,noexec,nosuid,size=16m,uid=82,gid=82
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # cgi-fcgi pide el ping.path del pool (api/docker/fpm-pool.conf); FPM responde sin PHP.
      test:
        - CMD-SHELL
        - SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  # The only service with bounded lock waits (ADR 0006 D35). php starts only after it succeeds,
  # which is also why `up --wait` accepts that it exits.
  migrate:
    <<: *laravel-runtime
    environment:
      <<: *laravel-env
      MYSQL_ATTR_INIT_COMMAND: 'SET SESSION lock_wait_timeout=5, innodb_lock_wait_timeout=5'
    command: ['migrate-and-import']
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'

  mysql:
    image: *mysql-image
    command: *mysql-command
    environment:
      MYSQL_DATABASE: taller
      MYSQL_USER: taller
      MYSQL_PASSWORD: *mysql-password
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en .env (sh api/scripts/init-env.sh)}'
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [app]
    healthcheck: *mysql-healthcheck
    # Sin cap_drop: el entrypoint de la imagen necesita chown sobre el volumen antes de bajar a
    # su usuario.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Base de pruebas descartable, en tmpfs y en la red `testing`, sin camino a la de desarrollo.
  # Root sin contraseña porque las pruebas en paralelo crean una base por proceso; no guarda
  # nada que proteger.
  mysql-test:
    profiles: [test]
    image: *mysql-image
    # Without --skip-log-bin each run adds about 135 MB of binlog to the 1 GB tmpfs.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_es_0900_ai_ci
      - --skip-log-bin
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: taller_test
    tmpfs:
      - /var/lib/mysql:rw,size=1g
    networks: [testing]
    healthcheck: *mysql-healthcheck
    security_opt:
      - no-new-privileges:true

  # Pest contra mysql-test (`npm run api:test`), con x-laravel-test-env.
  test:
    profiles: [test]
    build:
      context: ./api
      target: dev
      additional_contexts:
        repo: .
    entrypoint: ['php', 'vendor/bin/pest']
    environment: *laravel-test-env
    networks: [testing]
    # Root sin capacidades: Pest escribe cachés en archivos del proyecto, que son de root.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mysql-test:
        condition: service_healthy

networks:
  # La única red con salida: Nginx publica el puerto desde acá.
  edge: {}
  # Nginx y PHP-FPM, sin salida a Internet: Nginx llega a php:9000 y nada más.
  web:
    internal: true
  # PHP-FPM, migrate y MySQL, sin salida a Internet: 3306 sólo se ve desde acá, nunca desde Nginx.
  app:
    internal: true
  # Pruebas y su base descartable, sin camino a la de desarrollo.
  testing:
    internal: true

volumes:
  # Base de desarrollo. `docker compose down` la conserva; `down -v` la borra.
  mysql-data: {}
