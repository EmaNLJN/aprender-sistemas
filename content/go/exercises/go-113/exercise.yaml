title: Núcleo · Reproducí una traza LRU
level: medium
minutes: 20
imports:
  - reflect
intro: Vas a construir una caché LRU de capacidad fija y reproducir trazas de acceso. Cada hit mueve la entrada a la posición más reciente. En este ejercicio construís un núcleo verificable del proyecto; las cuatro etapas del taller lo convierten después en una herramienta completa.
why: Separar corrección de política permite preguntar qué datos se devuelven y, después, cuántas consultas evitaste. Una política puede funcionar bien con una carga y mal con otra.
objective: 'Empezá con caché vacía. Un hit promueve la clave a más reciente. Un miss incrementa misses y, con capacidad positiva, inserta expulsando la menos reciente si está llena. Capacidad <=0: todos misses y salida vacía. Devolvé (orden menos→más reciente, hits, misses). No modifiques accesos.'
instructions:
  - Buscá la clave antes de insertar; nunca dupliques una entrada.
  - Un hit también cambia la recencia.
  - Separá el contador de misses de la decisión de almacenar cuando capacidad es cero.
tests:
  - id: t1
    label: Un hit protege al reciente
    expression: func() bool { o,h,m := SimularLRU([]int{1,2,1,3},2); return reflect.DeepEqual(o,[]int{1,3}) && h==1 && m==3 }()
    why: El acceso repetido a 1 hace que salga 2.
    failure: Promové la clave en cada hit.
  - id: t2
    label: Sin capacidad y sin accesos
    expression: func() bool { a,h,m := SimularLRU([]int{9,9},0); b,h2,m2 := SimularLRU(nil,3); c,h3,m3 := SimularLRU([]int{1},-1); return len(a)==0 && h==0 && m==2 && len(b)==0 && h2==0 && m2==0 && len(c)==0 && h3==0 && m3==1 }()
    why: Una capacidad no positiva es un contrato definido.
    failure: Contá los misses incluso si no insertás.
  - id: t3
    label: Recencia y entrada preservada
    expression: func() bool { input := []int{4,4,2,4}; o,h,m := SimularLRU(input,3); return reflect.DeepEqual(o,[]int{2,4}) && h==2 && m==2 && reflect.DeepEqual(input,[]int{4,4,2,4}) }()
    why: La caché es estado propio, separado de la traza.
    failure: No uses accesos como buffer para guardar orden.
hints:
  - Una lista pequeña sirve aunque su búsqueda sea lineal.
  - Si encontrás la clave, quitá su posición y agregala al final.
  - Si no estaba y la lista está llena, quitá el primer elemento antes de agregar.
review:
  success: La traza distingue actualización de recencia, expulsión y capacidad cero. Los contadores representan accesos, no tiempo medido.
  pitfall: Este núcleo es O(accesos×capacidad). Una lista que expulsa solo por orden de inserción implementa FIFO, no LRU.
transfer: Devolvé además la clave expulsada en cada paso y compará la misma traza contra FIFO.
prediction:
  question: Con orden LRU→MRU [A,B,C], leés A y luego D. ¿Qué sale?
  options:
    - A
    - B
    - C
  answer: 1
  explanation: Leer A produce [B,C,A]; D expulsa B.
sources:
  - title: OSTEP · Replacement policies
    url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-beyondphys-policy.pdf
  - title: std · Vec
    url: https://doc.rust-lang.org/std/vec/struct.Vec.html
