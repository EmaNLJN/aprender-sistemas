title: Núcleo · Encontrá un hueco alineado
level: advanced
minutes: 20
intro: 'Modelás un allocator con intervalos: reservar divide un hueco, liberar devuelve un bloque y coalescer une huecos contiguos. En este ejercicio construís un núcleo verificable del proyecto; las cuatro etapas del taller lo convierten después en una herramienta completa.'
why: La capacidad total y el tamaño del mayor hueco responden preguntas distintas. La alineación también consume espacio aunque el objeto pedido sea pequeño.
objective: Cada hueco es (inicio,tamaño) con enteros u64/uint64. Buscá el primero en el orden recibido que contenga tamaño pedido >0, empezando en una dirección múltiplo de alineación. Alineación debe ser potencia de dos y >0. Ignorá huecos cuyo inicio+tamaño desborde. No cambies los huecos. Devolvé índice y dirección; señalá ausencia si parámetros inválidos o nada entra.
instructions:
  - Calculá el padding hasta el próximo múltiplo sin sumar ciegamente alineación−1.
  - El padding también ocupa parte del hueco disponible.
  - Probá un final de intervalo que no cabe en u64.
tests:
  - id: t1
    label: El padding consume hueco
    expression: func() bool { i,a,ok := PrimerAjuste([]Hueco{{3,5},{16,8}},5,4); j,b,ok2 := PrimerAjuste([]Hueco{{3,5}},4,4); return ok && i==1 && a==16 && ok2 && j==0 && b==4 }()
    why: El inicio alineado cambia la capacidad útil.
    failure: Descontá padding antes de comparar pedido.
  - id: t2
    label: First-fit y ajuste exacto
    expression: func() bool { i,a,ok := PrimerAjuste([]Hueco{{32,8},{0,32}},8,8); j,b,ok2 := PrimerAjuste([]Hueco{{0,4}},4,1); return ok && i==0 && a==32 && ok2 && j==0 && b==0 }()
    why: El orden recibido define cuál es primero.
    failure: No ordenes los huecos dentro de esta búsqueda.
  - id: t3
    label: Validación sin wraparound
    expression: func() bool { _,_,a := PrimerAjuste([]Hueco{{0,20}},0,4); _,_,b := PrimerAjuste([]Hueco{{0,20}},1,3); _,_,c := PrimerAjuste([]Hueco{{0,20}},1,0); _,_,d := PrimerAjuste([]Hueco{{^uint64(0)-1,4}},1,1); return !a && !b && !c && !d }()
    why: 'Go hace wrap en unsigned: hay que detectar overflow antes de sumar.'
    failure: Compará largo contra máximo−inicio.
hints:
  - Si inicio%alineación es cero, padding=0; si no, padding=alineación−resto.
  - Comprobá padding<=tamaño del hueco antes de restarlo.
  - El pedido entra si pedido<=hueco.tamaño−padding y las sumas son representables.
review:
  success: Los casos verifican alineación, orden first-fit y rechazo de intervalos no representables. La función solo encuentra una ubicación; reservarla requiere dividir el hueco después.
  pitfall: Redondear el inicio sin descontar padding puede aceptar un bloque que termina fuera del hueco. No se manipulan punteros reales.
transfer: Devolvé los intervalos libres anterior y posterior a la reserva y probá que no se solapan con lo asignado.
prediction:
  question: Hay huecos de 6 y 6 separados por un bloque vivo. ¿Entra una reserva contigua de 8?
  options:
    - 'Sí: hay 12 libres'
    - 'No: ningún hueco tiene 8'
    - Sí, si se cambia el nombre del bloque
  answer: 1
  explanation: La suma no vuelve contiguos los intervalos.
sources:
  - title: OSTEP · Free-space management
    url: https://pages.cs.wisc.edu/~remzi/OSTEP/vm-freespace.pdf
  - title: Writing an OS in Rust · Allocator designs
    url: https://os.phil-opp.com/allocator-designs/
