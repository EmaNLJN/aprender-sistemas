title: Lo que un quórum sí demuestra
level: expert
minutes: 20
workshopId: quorum
challengeType: kata
intro: Antes de simular réplicas, comprobá la propiedad matemática que necesitás. Para membresía fija de N nodos, conjuntos de tamaños W y R deben intersectarse si W+R>N.
why: La desigualdad estricta deja afuera conjuntos disjuntos que justo suman N. Además, sumar enteros sin cuidado puede desbordar y cambiar una condición verdadera a falsa.
objective: Validá N>0 y 1≤W,R≤N. Devolvé si TODOS los conjuntos de esos tamaños deben intersectarse. Una configuración inválida devuelve error.
instructions:
  - Trabajá con uint64/u64, incluyendo su máximo representable.
  - 'Evitá calcular W+R directamente: después de validar podés comparar W>N-R.'
  - 'No presentes true como consenso o linealizabilidad: solo verifica intersección de conjuntos fijos.'
tests:
  - id: t1
    label: Intersección estricta
    expression: func() bool { a,e1:=QuorumsIntersect(3,2,2); b,e2:=QuorumsIntersect(4,2,2); c,e3:=QuorumsIntersect(5,4,1); return e1==nil && a && e2==nil && !b && e3==nil && !c }()
    why: Detecta la frontera > frente a >=.
    failure: Sumar exactamente N no obliga a compartir un nodo.
  - id: t2
    label: Configuraciones imposibles
    expression: func() bool { for _,v:=range [][3]uint64{{0,0,0},{3,0,1},{3,1,0},{3,4,1},{3,1,4}} { _,e:=QuorumsIntersect(v[0],v[1],v[2]); if e==nil { return false } }; return true }()
    why: Requiere validar ambos tamaños y N.
    failure: Las precondiciones también hacen segura la resta.
  - id: t3
    label: Sin overflow al máximo
    expression: func() bool { max:=^uint64(0); a,e1:=QuorumsIntersect(max,max,max); b,e2:=QuorumsIntersect(max,1,max); c,e3:=QuorumsIntersect(max,1,max-1); return e1==nil && a && e2==nil && b && e3==nil && !c }()
    why: Comprueba la propiedad más allá de sumas representables.
    failure: No dependas de wrapping para decidir la desigualdad.
hints:
  - Si W+R=N, todavía pueden ser dos conjuntos disjuntos.
  - Con R≤N, la resta N-R es segura.
  - La condición equivalente es W>N-R.
review:
  success: La función separa configuración inválida, falta de garantía de intersección e intersección garantizada. No evalúa versiones, escritores concurrentes, quórums flexibles ni protocolos de consenso.
  pitfall: Intersección no elige un líder ni prueba que el valor seleccionado sea el más reciente.
transfer: Enumerá todos los subconjuntos para N pequeño y verificá la fórmula contra una comprobación exhaustiva.
prediction:
  question: 'N=4, W=2, R=2: ¿la intersección está garantizada?'
  options:
    - 'No: {A,B} y {C,D} son disjuntos'
    - Sí, ambos son mayoría
    - Solo si los nodos usan Rust
  answer: 0
  explanation: Dos de cuatro no es mayoría estricta; la suma es N, no mayor que N.
sources:
  - title: Dynamo · quórums y replicación
    url: https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf
