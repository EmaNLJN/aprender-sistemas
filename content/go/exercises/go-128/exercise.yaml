title: Buscá al dueño después del último token
level: advanced
minutes: 20
imports:
  - sort
workshopId: sharding
challengeType: kata
intro: Los hashes ya están calculados. Cada token posee los hashes mayores que el token anterior y menores o iguales al propio; después del último token, el anillo vuelve al primero.
why: Ordenar una copia conserva la configuración del llamador. Rechazar posiciones duplicadas evita que el dueño de un hash dependa accidentalmente del orden de entrada.
objective: Devolvé el nodo del primer token con posición ≥ hash; si no existe, el del token mínimo. Rechazá anillo vacío, posiciones duplicadas o nombres vacíos.
instructions:
  - La entrada puede estar desordenada y no debe modificarse.
  - Un mismo nodo puede tener varios tokens distintos; eso permite virtual nodes. Una posición repetida es inválida aunque repita el nodo.
  - Validá todo el anillo antes de devolver, incluso si el primer candidato ya parece suficiente.
tests:
  - id: t1
    label: Fronteras, desorden y vuelta
    expression: func() bool { ring:=[]Token{{70,"C"},{10,"A"},{40,"B"}}; for _,c:=range []struct{h uint32;want string}{{10,"A"},{11,"B"},{40,"B"},{71,"A"}} { got,e:=Owner(ring,c.h); if e!=nil||got!=c.want { return false } }; return ring[0].Position==70 }()
    why: Comprueba límite inclusivo, wrap e independencia del orden.
    failure: Elegí >=; cuando no existe, volvé al mínimo.
  - id: t2
    label: Validar todo el anillo
    expression: func() bool { for _,ring:=range [][]Token{nil,{{1,"A"},{9,"B"},{9,"C"}},{{1,"A"},{9,""}}} { got,e:=Owner(ring,0); if e==nil||got!="" { return false } }; return true }()
    why: Un candidato temprano no autoriza a ignorar ambigüedades posteriores.
    failure: Validá duplicados y nombres antes de buscar el dueño.
  - id: t3
    label: Nuevo intervalo y virtual nodes
    expression: func() bool { ring:=[]Token{{10,"A"},{25,"D"},{40,"B"},{70,"C"}}; for _,c:=range []struct{h uint32;want string}{{15,"D"},{30,"B"},{5,"A"}} { got,e:=Owner(ring,c.h); if e!=nil||got!=c.want { return false } }; name,e:=Owner([]Token{{10,"A"},{90,"A"}},80); return e==nil&&name=="A" }()
    why: Agregar un token cambia su intervalo; repetir nodo en otro token sí es válido.
    failure: Distinguí duplicar posición de asignar varias posiciones al mismo nodo.
hints:
  - Cloná los tokens y ordenalos por posición.
  - Buscá posiciones repetidas en vecinos y validá nombres.
  - Si no encontrás posición ≥ hash, elegí la primera de la copia ordenada.
review:
  success: La propiedad queda definida en las fronteras y no depende del orden del slice. Esto calcula destinos, no migra valores, replica datos ni demuestra distribución uniforme de carga.
  pitfall: Agregar un nodo cambia un dueño lógico; los bytes todavía pueden estar en el servidor anterior. La transición de membresía requiere un protocolo adicional.
transfer: Agregá virtual nodes y compará dispersión de carga sobre una muestra grande de hashes reproducibles.
prediction:
  question: Tokens 10/A,40/B,70/C. ¿Hash 40 pertenece a…?
  options:
    - A
    - B
    - C
  answer: 1
  explanation: 'El límite derecho es inclusivo: el primer token ≥40 es 40/B.'
sources:
  - title: Envoy · Ring hash
    url: https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/load_balancing/load_balancers#ring-hash
