title: Núcleo · Una instrucción llega hasta la RAM
level: expert
minutes: 25
imports:
  - reflect
intro: 'Ya sabés traducir direcciones. Ahora conectá esa traducción con sus efectos: una instrucción puede completar, necesitar un mapeo y reintento, o terminar por protección. La traza hace visible el recorrido; no usa la MMU de tu computadora.'
why: Una ausencia no debe consumir la instrucción ni confirmar su escritura. El kernel resuelve una causa autorizada, vuelve al mismo acceso y recién entonces la CPU puede retirarlo. Un permiso insuficiente no se arregla concediendo W automáticamente.
objective: 'Simulá accesos secuenciales con páginas de 4 celdas. RAM inicial=[10,11,12,13,20,21,22,23,0,0,0,0]. VPN 0→marco 1 R; VPN 1→marco 0 RW; VPN 2 ausente y demand-zero válida. TLB inicialmente vacía, sin expulsiones. Devolvé (RAM final, acumulador inicialmente 0, accesos retirados, traza). Leer carga el acumulador; escribir lo conserva. Ante dirección fuera de [0,12), agregá range y detené todo. En un miss agregá miss: si la PTE existe agregá walk y cacheala; si falta agregá fault,map,retry, mapeá VPN 2→marco 2 RW con ceros y repetí el MISMO acceso (generará otro miss). En un hit agregá hit. Después comprobá permisos: STORE en R agrega protection y detiene sin escribir ni retirar. Un acceso permitido agrega load o store y se retira una vez. Detener conserva los efectos previos; ignora accesos posteriores.'
instructions:
  - Representá tabla y TLB por separado, ambas con marco y permiso de escritura. La entrada ausente no es un marco cero.
  - Usá un reintento explícito solo para la VPN 2 ausente. Su mapeo se hace una vez; no hay bucle ilimitado.
  - Validá rango y permiso antes de tocar RAM. Mantené orden exacto de los eventos y no incrementes retiradas en fallos.
tests:
  - id: t1
    label: Walk normal y luego hit sin kernel
    expression: func() bool { r,a,n,t:=EjecutarPC([]AccesoPC{{VA:1},{VA:2}}); return reflect.DeepEqual(r,[]byte{10,11,12,13,20,21,22,23,0,0,0,0}) && a==22 && n==2 && reflect.DeepEqual(t,[]string{"miss","walk","load","hit","load"}) }()
    why: Dos direcciones de una página comparten traducción; ninguna lectura cambia RAM.
    failure: La dirección física viene del marco, no de la VPN.
  - id: t2
    label: Demand-zero, reintento y escritura posterior
    expression: func() bool { r,a,n,t:=EjecutarPC([]AccesoPC{{VA:9},{VA:10,Escribir:true,Valor:77},{VA:10}}); return reflect.DeepEqual(r,[]byte{10,11,12,13,20,21,22,23,0,0,77,0}) && a==77 && n==3 && reflect.DeepEqual(t,[]string{"miss","fault","map","retry","miss","walk","load","hit","store","hit","load"}) }()
    why: El reintento no suma un acceso retirado; la escritura posterior sobrevive a los hits.
    failure: Una entrada válida debe llevar presente=true. No inicialices el marco en cada acceso.
  - id: t3
    label: Protección, rango inválido y vacío
    expression: func() bool { r,a,n,t:=EjecutarPC([]AccesoPC{{VA:5,Escribir:true,Valor:44},{VA:1,Escribir:true,Valor:99},{VA:5,Escribir:true,Valor:88}}); if !reflect.DeepEqual(r,[]byte{10,44,12,13,20,21,22,23,0,0,0,0}) || a!=0 || n!=1 || !reflect.DeepEqual(t,[]string{"miss","walk","store","miss","walk","protection"}) { return false }; for _,va:=range []int{-1,12} { r,a,n,t=EjecutarPC([]AccesoPC{{VA:va},{VA:1}}); if !reflect.DeepEqual(r,[]byte{10,11,12,13,20,21,22,23,0,0,0,0}) || a!=0 || n!=0 || !reflect.DeepEqual(t,[]string{"range"}) { return false } }; _,a,n,t=EjecutarPC(nil); return a==0 && n==0 && len(t)==0 }()
    why: El rechazo conserva efectos previos; rango se valida antes de indexar y nil representa una traza vacía.
    failure: El break por protección debe salir del programa entero, no solo del reintento interno.
hints:
  - Cada entrada puede ser opcional. Tabla y TLB son tres lugares; el offset es VA % 4.
  - En el miss de VPN 2, inicializá marco 2, publicá la entrada e iterá otra vez sin avanzar el índice del acceso.
  - 'Tras hit/walk: rechazá si es escritura y !write. Si está permitido calculá frame*4+offset, ejecutá, sumá una retirada y salí del bucle interno.'
review:
  success: Los casos comprueban miss→walk→RAM, hit, fault→map→retry y protección que conserva efectos anteriores. La traza prueba el protocolo observable de este contrato; no mide ciclos ni valida una CPU física.
  pitfall: 'No confundas TLB miss con page fault. La traza del primer acceso demand-zero tiene DOS misses: uno descubre la ausencia y el reintento vuelve a buscar. Una escritura protegida puede encontrar una traducción válida y aun así no estar autorizada.'
transfer: En tu proyecto, reemplazá los strings de eventos por un enum/tipo y agregá PC explícito, timer pendiente, trap frame y ACK. Una IRQ entre instrucciones debe guardar la continuación; un fault conserva el acceso fallido.
prediction:
  question: La VPN 2 está ausente. Su primer acceso se resuelve con mapeo, invalidación y reintento, como exige este contrato. ¿Cuántos misses aparecen antes de completar?
  options:
    - Cero, el kernel evita la TLB
    - 'Uno: el reintento es siempre hit'
    - 'Dos: primero detecta la ausencia y luego consulta el mapeo nuevo'
  answer: 2
  explanation: El mapeo actualiza la tabla, no llena automáticamente la TLB. Reintentar produce miss→walk y después completa. Otras arquitecturas pueden organizar pasos internos de otra manera; este es el protocolo especificado.
