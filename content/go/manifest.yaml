# Etapas de Go en orden. La etapa de un ejercicio es la posición de su etapa en este
# archivo, contando las secciones en orden: lab, quests y systems. Los IDs son inmutables:
# indexan el progreso guardado. El orden sale de acá, nunca del número del ID.
# Cada ejercicio toma `defaults`, después los valores de su etapa y encima su exercise.yaml.
defaults:
  kind: completar
  imports: []
  visual: flow
lab:
  - topicId: go-basics
    topic: Tipos y primeros pasos
    minutes: 10
    sources:
      - title: Tipos en Go
        url: https://go.dev/ref/spec#Types
    exercises:
      - go-01
      - go-02
      - go-03
      - go-04
      - go-05
