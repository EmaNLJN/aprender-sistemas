title: Núcleo · Los saltos aterrizan en instrucciones
level: advanced
minutes: 20
intro: Vas a especificar una ISA pequeña, validar límites de instrucciones y ejecutar un intérprete paso a paso. En este ejercicio construís un núcleo verificable del proyecto; las cuatro etapas del taller lo convierten después en una herramienta completa.
why: Un programa puede estar formado por bytes válidos y aun saltar al medio de un operando. Decodificar, validar y ejecutar son responsabilidades distintas.
objective: 'Bytecode: 0=HALT y 2=DEC ocupan un byte; 1,n=SET y 3,p=JNZ ocupan dos. p es un offset absoluto en bytes. Devolvé todos los inicios de instrucciones, ordenados. Vacío→"vacio"; opcode desconocido→"opcode"; operando faltante→"operando". Primero decodificá TODO, incluso bytes después de HALT; después verificá cada destino JNZ: debe coincidir con un inicio, o "salto". No exigís HALT ni garantizás terminación.'
instructions:
  - 'Primera pasada: registrá inicios y destinos de saltos mientras avanzás según tamaño.'
  - No interpretes el valor de un operando como opcode.
  - 'Segunda pasada: rechazá destinos fuera del programa o dentro de un operando.'
tests:
  - id: t1
    label: Programa normal y salto hacia adelante
    expression: validar_bytecode(&[1,3,2,3,2,0]) == Ok(vec![0,2,3,5]) && validar_bytecode(&[3,3,2,0]) == Ok(vec![0,2,3])
    why: Los destinos se verifican después de conocer todos los inicios.
    failure: No rechaces un salto solo porque apunta a una instrucción aún no recorrida.
  - id: t2
    label: Dentro de operando o fuera del programa
    expression: validar_bytecode(&[1,7,3,1,0]) == Err("salto") && validar_bytecode(&[3,9,0]) == Err("salto")
    why: Estar dentro del slice es necesario, pero no suficiente.
    failure: La pertenencia se comprueba en inicios, no solo en 0..len.
  - id: t3
    label: Formato completo antes de destinos
    expression: validar_bytecode(&[]) == Err("vacio") && validar_bytecode(&[1]) == Err("operando") && validar_bytecode(&[3,9,8]) == Err("opcode") && validar_bytecode(&[0,8]) == Err("opcode") && validar_bytecode(&[2]) == Ok(vec![0])
    why: Se revisa todo el bytecode y no se inventa un requisito de HALT.
    failure: La validación estructural no ejecuta ni se detiene en HALT.
hints:
  - Un salto hacia adelante puede apuntar a un inicio que todavía no conocés en la primera pasada.
  - SET y JNZ comparten tamaño, pero solo JNZ agrega un destino para validar.
  - 'Probá [1,7,3,1,0]: el destino 1 es el operando de SET, no una instrucción.'
review:
  success: Los casos separan estructura de instrucciones y validez de destinos. Un programa estructuralmente válido puede fallar o consumir todos sus pasos al ejecutarse.
  pitfall: Validar bytes no resuelve el problema de terminación ni demuestra que el algoritmo del programa sea correcto. El intérprete sigue necesitando límites y errores propios.
transfer: Agregá un desensamblador que muestre offset, nombre y operando solo después de superar esta validación.
prediction:
  question: Una instrucción ocupa opcode y operando. ¿Todo índice dentro del bytecode es un destino de salto válido?
  options:
    - Sí, mientras esté en rango
    - 'No: debe ser inicio de instrucción'
    - Solo si el byte es par
  answer: 1
  explanation: La estructura del programa importa además del rango.
sources:
