title: Núcleo · Elegí y confirmá una interrupción
level: expert
minutes: 20
intro: Modelás registros de un periférico, un evento pendiente, una máscara de entrega y el ciclo entrar a ISR→atender→ACK. En este ejercicio construís un núcleo verificable del proyecto; las cuatro etapas del taller lo convierten después en una herramienta completa.
why: Los registros MMIO tienen semántica de dispositivo, no de variables comunes. Algunas escrituras activan acciones y algunas lecturas tienen efectos; el manual especifica cada caso.
objective: pendientes y habilitadas son máscaras de8 bits. Elegí la IRQ de menor índice entre pendientes & habilitadas. Devolvé ese índice y la máscara pendiente luego de limpiar SOLO su bit. Sin IRQ entregable, devolvé ausencia y la máscara original. La IRQ0 es la prioridad más alta de este modelo. No accedas a MMIO real.
instructions:
  - Calculá candidatas con AND de ambas máscaras.
  - 'Elegí un único bit: el menos significativo que esté activo.'
  - Limpiá ese bit en pendientes conservando incluso los pendientes enmascarados.
tests:
  - id: t1
    label: Prioridad y una confirmación a la vez
    expression: atender_irq(0b1010,0b1111)==(Some(1),0b1000) && atender_irq(0b1000,0b1111)==(Some(3),0)
    why: La primera atención conserva la otra IRQ lista.
    failure: No limpies todas las candidatas a la vez.
  - id: t2
    label: El bit bajo puede estar enmascarado
    expression: atender_irq(0b1001,0b1000)==(Some(3),0b0001) && atender_irq(0b1000_0001,0b1000_0000)==(Some(7),1)
    why: Elegís sobre candidatas pero limpiás sobre pendientes originales.
    failure: El evento enmascarado debe conservarse.
  - id: t3
    label: Sin entrega no hay pérdida
    expression: atender_irq(0b0101,0b1010)==(None,0b0101) && atender_irq(0,255)==(None,0) && atender_irq(1,1)==(Some(0),0)
    why: Ausencia es distinta de atender IRQ cero.
    failure: Option diferencia None de Some(0).
hints:
  - 'El índice es distinto de la máscara: IRQ3 corresponde a 1<<3.'
  - Si candidatas==0 no intentes elegir un bit.
  - 'Para limpiar uno: pendientes & !(1<<indice), o &^ en Go.'
review:
  success: Los casos verifican prioridad, máscaras y confirmación selectiva. Un evento no entregable sigue pendiente para una habilitación posterior.
  pitfall: Prioridad numérica, máscaras y ACK dependen del dispositivo. Esta operación pura no es una ISR real ni determina el comportamiento de registros MMIO.
transfer: Agregá prioridad configurable y comprobá que una IRQ de baja prioridad no quede sin atención bajo tu política.
prediction:
  question: ENABLE=0 y el periférico activa PENDING. ¿Qué sucede en este modelo?
  options:
    - Se borra el evento
    - Queda pendiente sin entrar a ISR
    - La CPU entra a ISR de todos modos
  answer: 1
  explanation: La máscara impide la entrega; no borra el registro pendiente.
