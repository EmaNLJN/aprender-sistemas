bridge:
  rust: Exportá a Cargo y modelá instrucciones/traps con enum. Esta simulación usa std y memoria segura. Un kernel real requiere target, bootloader, no_std y reglas de arquitectura fuera del Playground.
  go: Exportá a un módulo Go y separá CPU y bus con tipos pequeños. Go estándar ejecuta sobre runtime/OS; sirve para el simulador. No convierte estas funciones en un kernel bare metal ni en controladores de MMU.
