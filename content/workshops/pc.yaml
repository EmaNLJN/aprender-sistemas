id: pc
model: pc
category: machine
level: expert
minutes: 75
title: Construí una PC de bolsillo
subtitle: 'CPU, TLB, memoria y kernel: todas las piezas conversan.'
story: Sos quien arma una computadora con la tapa transparente. Una carga de memoria recorre ventanillas; el timer interrumpe la atención y el kernel resuelve qué puede continuar. Cada paso tiene una causa visible.
what: Integrás una CPU LOAD/STORE/HALT con traducción virtual, permisos, RAM, page fault recuperable e IRQ de timer. El código enlazado implementa el núcleo de accesos con reintento y eventos verificables.
why: Estudiar componentes separados sirve; conectarlos explica cuándo el CPU puede confirmar una escritura, por qué un miss común no llama al kernel y por qué reintentar un fault exige conservar la instrucción fallida.
uses:
  - Leer trazas de fallos de memoria con contexto
  - Comprender la frontera entre hardware y kernel
  - Diseñar máquinas de estados con efectos que se confirman una sola vez
limits: Es un modelo lógico de un único CPU y proceso, con tres páginas de cuatro celdas y tabla de un nivel. No emula x86, RISC-V ni un sistema arrancable; omite pipeline, cachés de datos, privilegios completos, DMA, multinúcleo y tiempos. El programa se guarda aparte de RAM, sin traducción de instrucciones. La MMU se representa en software y los pulsos se inyectan manualmente. Nand2Tetris desarrolla la máquina Hack y su cadena de herramientas; no equivale a esta MMU. Ripes permite explorar microarquitecturas RISC-V, cachés y MMIO; este taller no afirma que ejecute nuestro kernel. Su README enlaza ripes.dk como versión web experimental.
objectives:
  - id: translate
    label: Compará un page walk normal y un TLB hit
    why: Una PTE presente resuelve el miss sin excepción ni kernel.
  - id: protect-retry
    label: Rechazá una escritura y recuperá una ausencia
    why: Permiso insuficiente y página ausente requieren políticas diferentes; solo la ausencia válida se mapea y reintenta.
  - id: interrupt
    label: Guardá PC, reconocé el timer y retorná
    why: Una IRQ externa conserva la continuación, mientras un fault conserva la instrucción que debe reintentarse.
prediction:
  question: LOAD 9 produce TLB miss y luego la tabla indica página ausente. ¿Qué debe hacer el kernel si esa región es demand-zero válida?
  options:
    - Avanzar PC y devolver cualquier dato
    - Mapear un marco inicializado y reintentar el mismo PC
    - Convertir todo TLB miss en una interrupción de timer
  answer: 1
  explanation: El miss inicia la búsqueda. La ausencia provoca el fault síncrono; el handler resuelve su causa y vuelve a la instrucción que todavía no completó.
steps:
  - id: e1
    v1Index: 0
    title: Dibujá estados y contratos
    task: Definí CPU, RAM, PTE, TLB y trap frame. Anotá qué campos puede modificar cada etapa y separá VA de PA.
    why: Los tipos de dirección y los efectos permitidos evitan confundir traducción con acceso real.
    done: Podés trazar LOAD 1 sin cambiar RAM y STORE 1 sin confirmar una escritura.
  - id: e2
    v1Index: 1
    title: Programá el recorrido de memoria
    task: Completá el núcleo enlazado. Registrá hit, miss, fault, mapeo y retiro de cada acceso; no consumas PC al fallar.
    why: La traza convierte decisiones ocultas en un contrato que se prueba.
    done: Pasan los tres casos y un caso propio donde la misma página pasa de miss a hit.
  - id: e3
    v1Index: 2
    title: Agregá interrupciones precisas
    task: En el proyecto descargable, agregá el timer pendiente, trap frame, ACK y retorno entre instrucciones. Conservá PC y acumulador.
    why: Interrumpir un programa exige preservar su continuación; la escritura debe confirmarse como máximo una vez.
    done: Una IRQ inyectada durante un acceso espera al retiro, se reconoce y vuelve al PC siguiente.
  - id: e4
    v1Index: 3
    title: Compará con una máquina mayor
    task: Usá el IDE web de Nand2Tetris para CPU/Hack o Ripes para RISC-V y contrastá sus instrucciones con las tuyas. Leé traps en xv6 y documentá tres diferencias.
    why: Los límites explícitos permiten transferir conceptos sin asumir que todos los simuladores ejecutan el mismo hardware.
    done: Tu README incluye una traza normal, una por protección y una por IRQ, además de tres simplificaciones del modelo.
