name: taller-rust-go-preview
services:
  preview:
    image: taller-rust-go-taller:latest
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    network_mode: bridge
    ports:
      - '127.0.0.1:8765:8080'
    volumes:
      - ../dist:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
