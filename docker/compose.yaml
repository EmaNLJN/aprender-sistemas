x-mysql-password: &mysql-password '${MYSQL_PASSWORD:?falta MYSQL_PASSWORD en .env (sh backend/api/scripts/init-env.sh)}'

x-laravel-env: &laravel-env
  APP_NAME: Taller
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_KEY: '${APP_KEY:?falta APP_KEY en .env (sh backend/api/scripts/init-env.sh)}'
  APP_URL: 'http://localhost:${TALLER_PORT:-8080}'
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: '3306'
  DB_DATABASE: taller
  DB_USERNAME: taller
  DB_PASSWORD: *mysql-password
  APP_LOCALE: es
  LOG_STDERR_FORMATTER: 'Monolog\Formatter\JsonFormatter'
  LOG_HMAC_KEY: '${LOG_HMAC_KEY:?falta LOG_HMAC_KEY en .env (sh backend/api/scripts/init-env.sh)}'

x-laravel-test-env: &laravel-test-env
  <<: *laravel-env
  APP_KEY: 'base64:dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtISE='
  DB_PASSWORD: no-es-un-secreto
  LOG_HMAC_KEY: no-es-un-secreto

x-laravel-runtime: &laravel-runtime
  build:
    context: ./backend/api
    target: runtime
    additional_contexts:
      repo: .
    args:
      CONTENT_SOURCE_COMMIT: '${CONTENT_SOURCE_COMMIT:-}'
  environment: *laravel-env
  networks: [app]
  dns: ['127.0.0.1']
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 256m
  pids_limit: 64

x-mysql-image: &mysql-image mysql:9.7@sha256:e2bde46db6563855d7177adb5f0b57b9dc663f5a20927a90f4259d3312068497

x-mysql-command: &mysql-command
  - --character-set-server=utf8mb4
  - --collation-server=utf8mb4_es_0900_ai_ci

# Over TCP: while initializing, the temporary server listens only on the socket and would answer ping early (ADR 0004).
x-mysql-healthcheck: &mysql-healthcheck
  test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 60s
  start_interval: 2s

services:
  taller:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    networks: [edge, web]
    dns: ['127.0.0.1']
    ports:
      - '127.0.0.1:${TALLER_PORT:-8080}:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64

  php:
    <<: *laravel-runtime
    networks: [web, app]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      # uid/gid 82 is www-data in Alpine; otherwise the tmpfs is root:root and php cannot compile views.
      - /var/www/html/storage/framework/views:rw,noexec,nosuid,size=16m,uid=82,gid=82
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  # The only service with bounded lock waits (ADR 0006 D35). php starts only after it succeeds,
  # which is also why `up --wait` accepts that it exits.
  migrate:
    <<: *laravel-runtime
    environment:
      <<: *laravel-env
      MYSQL_ATTR_INIT_COMMAND: 'SET SESSION lock_wait_timeout=5, innodb_lock_wait_timeout=5'
    command: ['migrate-and-import']
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'

  scheduler:
    <<: *laravel-runtime
    command: ['php', 'artisan', 'schedule:work']
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The only file with MySQL users and privileges is docker/mysql/db-grants.sql. A volume that already exists
  # takes it with `docker compose --profile ops run --rm db-grants`; a new one takes it from the init directory.
  db-grants:
    profiles: [ops]
    image: *mysql-image
    entrypoint: ['sh', '-c', 'mysql -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" < /db-grants.sql']
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en .env (sh backend/api/scripts/init-env.sh)}'
    volumes:
      - ./docker/mysql/db-grants.sql:/db-grants.sql:ro
    networks: [app]
    dns: ['127.0.0.1']
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'

  mysql:
    image: *mysql-image
    command: *mysql-command
    environment:
      MYSQL_DATABASE: taller
      MYSQL_USER: taller
      MYSQL_PASSWORD: *mysql-password
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en .env (sh backend/api/scripts/init-env.sh)}'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/db-grants.sql:/docker-entrypoint-initdb.d/10-db-grants.sql:ro
    networks: [app]
    dns: ['127.0.0.1']
    healthcheck: *mysql-healthcheck
    # No cap_drop: the entrypoint needs chown on the volume before dropping privileges.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mysql-test:
    profiles: [test]
    image: *mysql-image
    # Without --skip-log-bin each run adds about 135 MB of binlog to the 1 GB tmpfs.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_es_0900_ai_ci
      - --skip-log-bin
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: taller_test
    tmpfs:
      - /var/lib/mysql:rw,size=1g
    networks: [testing]
    dns: ['127.0.0.1']
    healthcheck: *mysql-healthcheck
    security_opt:
      - no-new-privileges:true

  test:
    profiles: [test]
    build:
      context: ./backend/api
      target: dev
      additional_contexts:
        repo: .
    entrypoint: ['php', 'vendor/bin/pest']
    environment: *laravel-test-env
    networks: [testing]
    dns: ['127.0.0.1']
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mysql-test:
        condition: service_healthy

networks:
  edge: {}
  web:
    internal: true
  app:
    internal: true
  testing:
    internal: true

volumes:
  mysql-data: {}
