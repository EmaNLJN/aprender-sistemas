worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    map $uri $session_limit_key { default ""; ~^/api/session/?$ $binary_remote_addr; }
    limit_req_zone $session_limit_key zone=session:10m rate=5r/s;
    limit_req_status 429;
    log_format api '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_id';
    # A location with its own add_header drops the server ones: both read the policy from here.
    map $uri $content_security_policy { default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://play.rust-lang.org https://play.golang.org; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"; }
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;
    # Resolves `php` on every request: Nginx starts without the service and follows a recreated container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server {
        listen 8080;
        # Relative redirects: the /api to /api/ 301 must not name the internal port 8080.
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $content_security_policy always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location = /favicon.ico { access_log off; log_not_found off; return 204; }
        location ^~ /api/ {
            access_log /dev/stdout api;
            limit_req zone=api burst=400 nodelay;
            limit_req zone=session burst=60 nodelay;
            error_page 429 = @too_many_requests;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy $content_security_policy always;
            add_header X-Request-Id $request_id always;
            fastcgi_hide_header X-Request-Id;
            set $php_upstream php:9000;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            # Override the fastcgi_params values (PHP-FPM takes the last) with the php image front controller.
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            # httpoxy: a client Proxy header never reaches PHP as HTTP_PROXY.
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTP_X_REQUEST_ID $request_id;
            fastcgi_pass $php_upstream;
        }
        location @too_many_requests {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"message":"Demasiados intentos. Esperá un momento antes de volver a probar.","code":"too_many_requests"}';
        }
        location / { try_files $uri $uri/ =404; }
    }
}
