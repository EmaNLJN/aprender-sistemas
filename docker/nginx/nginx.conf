worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;
    # Resolves `php` on every request: Nginx starts without the service and follows a recreated container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server {
        listen 8080;
        # Relative redirects: the /api to /api/ 301 must not name the internal port 8080.
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://play.rust-lang.org https://play.golang.org; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location = /favicon.ico { access_log off; log_not_found off; return 204; }
        # No add_header here: the location inherits the server headers, CSP included.
        location ^~ /api/ {
            set $php_upstream php:9000;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            # Override the fastcgi_params values (PHP-FPM takes the last) with the php image front controller.
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            # httpoxy: a client Proxy header never reaches PHP as HTTP_PROXY.
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass $php_upstream;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
